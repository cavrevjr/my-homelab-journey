services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin

    ports:
      - 8096:8096/tcp
      - 7359:7359/udp

    volumes:
      - /opt/homelab/data/jellyfin/config:/config
      - /opt/homelab/data/jellyfin/cache:/cache
      - /opt/homelab/data/jellyfin/media:/media

    restart: unless-stopped

